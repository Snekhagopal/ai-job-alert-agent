# Workday career sites, via the public no-login JSON endpoint each career site itself uses.
# Not a documented public API, so it can be switched off here at any time (enabled: false).
# robots.txt is checked on every host. Searches use the site's own India location filter.
# Workday gives the posting DATE only. Find a company's values from its careers URL:
#   https://<tenant>.<wd>.myworkdayjobs.com/<site>   (e.g. intel.wd1.myworkdayjobs.com/External)
workday:
  enabled: true
  interval_minutes: 5
  max_pages: 1          # 20 postings per search term per check
  search_terms: ["machine learning", "AI engineer", "data scientist", "deep learning", "NLP",
                 "computer vision", "generative AI", "LLM"]
  tenants:
    - { company: Intel, tenant: intel, wd: wd1, site: External }                          # careers-link
    - { company: Mastercard, tenant: mastercard, wd: wd1, site: CorporateCareers }        # careers-link
    - { company: Target, tenant: target, wd: wd5, site: targetcareers }                   # careers-link
    - { company: KLA, tenant: kla, wd: wd1, site: Search }                                # careers-link (Chennai)
    - { company: Micron, tenant: micron, wd: wd1, site: External }                        # careers-link
    - { company: Caterpillar, tenant: cat, wd: wd5, site: CaterpillarCareers }            # careers-link
    - { company: Wolters Kluwer, tenant: wk, wd: wd3, site: External }                    # careers-link
    - { company: Expedia Group, tenant: expedia, wd: wd108, site: search }                # careers-link
    - { company: NVIDIA, tenant: nvidia, wd: wd5, site: NVIDIAExternalCareerSite }        # board-name
    - { company: Adobe, tenant: adobe, wd: wd5, site: external_experienced }              # board-name
    - { company: PayPal, tenant: paypal, wd: wd1, site: jobs }                            # board-name (Chennai)
    - { company: HP, tenant: hp, wd: wd5, site: ExternalCareerSite }                      # board-name
    - { company: Philips, tenant: philips, wd: wd3, site: jobs-and-careers }              # board-name
    - { company: Thomson Reuters, tenant: thomsonreuters, wd: wd5, site: External_Career_Site }  # board-name
    - { company: Gartner, tenant: gartner, wd: wd5, site: EXT }                           # board-name (Chennai)
    - { company: Salesforce, tenant: salesforce, wd: wd12, site: External_Career_Site }   # board-name
    - { company: Lowe's, tenant: lowes, wd: wd5, site: LWS_External_CS }                  # board-name

# Official aggregator APIs (free keys). Adzuna covers many Indian boards; descriptions are snippets.
# Adzuna's free tier is rate limited, so it is polled every 30 min with few queries.
adzuna:
  enabled: false   # set true after adding ADZUNA_APP_ID / ADZUNA_APP_KEY
  interval_minutes: 30
  queries:
    - { what: "machine learning engineer", where: "Bangalore", max_days_old: 2 }
    - { what: "machine learning engineer", where: "Chennai", max_days_old: 2 }
    - { what: "AI engineer remote", max_days_old: 2 }

jooble:
  enabled: false   # set true after adding JOOBLE_API_KEY
  interval_minutes: 30
  queries:
    - { keywords: "machine learning engineer fresher", location: "Bangalore" }
    - { keywords: "AI ML engineer", location: "Chennai" }
    - { keywords: "generative AI engineer remote", location: "India" }

# Any RSS/Atom job feed you are allowed to read. robots.txt is enforced.
rss: []
#  - { name: example-company, url: "https://careers.example.com/jobs.rss", company: Example, interval_minutes: 15 }

# Job-alert emails delivered to YOUR Gmail inbox (create the alerts on each site first:
# docs/EMAIL_ALERTS.md). Gmail is checked every minute; the real delay is how often each
# platform sends its alerts, usually once a day. A platform's parser counts as verified only
# after a REAL sample email passes (scripts/capture_alert_samples.py). Platforms marked
# "awaiting sample" stay disabled until then, so their emails are not marked processed
# with zero jobs extracted. `query` is optional (sender-domain default in job_sources.py).
email_interval_minutes: 1
email_alerts:
  linkedin:    { enabled: true }    # parser verified with a sample email
  naukri:      { enabled: true }    # existing parser, not yet checked against a real email
  instahyre:   { enabled: true }    # existing parser, not yet checked against a real email
  cutshort:    { enabled: true }    # existing parser, not yet checked against a real email
  wellfound:   { enabled: true }    # existing parser, not yet checked against a real email
  indeed:      { enabled: false }   # awaiting sample
  glassdoor:   { enabled: false }   # awaiting sample
  foundit:     { enabled: false }   # awaiting sample
  iimjobs:     { enabled: false }   # awaiting sample
  hirist:      { enabled: false }   # awaiting sample
  timesjobs:   { enabled: false }   # awaiting sample
  internshala: { enabled: false }   # awaiting sample
  shine:       { enabled: false }   # awaiting sample
