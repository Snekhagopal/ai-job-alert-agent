# Job sources. Every board below was checked to respond on its public API on 2026-10-31.
# Add more companies by finding their careers page's ATS:
#   jobs.lever.co/<slug>            -> lever: company_slug
#   boards.greenhouse.io/<board> or job-boards.greenhouse.io/<board> -> greenhouse: board
#   jobs.ashbyhq.com/<org>          -> ashby: org
# Test a new entry with:  python scripts/check_sources.py

# ATS boards answer 304 Not Modified when nothing changed, so a 2-minute poll is cheap.
default_interval_minutes: 2

# Boards added on 2026-10-31 were verified live: the board API answered, its company name
# matched, and it had India-based roles. "careers-link" = the company's own careers page (or
# the board's job URLs) points to this board; "board-name" = name and job content match but
# the careers page is JavaScript-rendered, so the link itself could not be confirmed.
greenhouse:
  - { board: razorpaysoftwareprivatelimited, company: Razorpay }
  - { board: groww, company: Groww }
  - { board: inmobi, company: InMobi }
  - { board: databricks, company: Databricks }
  - { board: druva, company: Druva }
  - { board: mongodb, company: MongoDB }            # careers-link (jobs on mongodb.com)
  - { board: elastic, company: Elastic }            # careers-link (jobs.elastic.co)
  - { board: rubrik, company: Rubrik }              # careers-link (jobs on rubrik.com)
  - { board: observeai, company: Observe.AI }       # careers-link (embed on observe.ai/careers)
  - { board: netskope, company: Netskope }          # careers-link (jobs on netskope.com)
  - { board: glance, company: Glance }              # careers-link (glance.com/careers)
  - { board: truefoundry, company: TrueFoundry }    # careers-link (careerpuck page)
  - { board: zscaler, company: Zscaler }            # board-name
  - { board: gleanwork, company: Glean }            # board-name
  - { board: turing, company: Turing }              # board-name
  - { board: sigmoid, company: Sigmoid }            # board-name
  - { board: hackerrank, company: HackerRank }      # board-name
  - { board: anthropic, company: Anthropic }        # board-name

lever:
  - { company_slug: cred, company: CRED }
  - { company_slug: meesho, company: Meesho }
  - { company_slug: fampay, company: FamPay }
  - { company_slug: zeta, company: Zeta }
  - { company_slug: paytm, company: Paytm }
